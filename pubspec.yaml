name: servis_takip
description: Personel Servis Takip Uygulaması - Flutter + Bloc + Firebase
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_database: ^10.4.0
  firebase_messaging: ^14.7.9

  # Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # HTTP & APIs
  http: ^1.2.0
  dio: ^5.4.0

  # UI
  cupertino_icons: ^1.0.6
  flutter_polyline_points: ^2.0.0
  intl: ^0.19.0
  fluttertoast: ^8.2.4

  # Utils
  uuid: ^4.2.2
  shared_preferences: ^2.2.2
  rxdart: ^0.27.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  bloc_test: ^9.1.5
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/
